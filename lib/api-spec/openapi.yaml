        metaWebhookToken: { type: string }
        instagramPageId: { type: string }
        customGreeting: { type: string }
        shopPlaybook: { type: string }
        blockedTopics: { type: array, items: { type: string } }
        escalateKeywords: { type: array, items: { type: string } }
        autoReplyEnabled: { type: boolean }
        menuAccent: { type: string }
        availabilityHours: { type: string }
        dietaryPolicy: { type: string }
        activeOffers: { type: string }

    KnowledgeReindexResult:
      type: object
      required: [bakerId, chunksIndexed, embeddingProvider, message]
      properties:
        bakerId: { type: integer }
        chunksIndexed: { type: integer }
        embeddingProvider: { type: string, enum: [openai, local] }
        message: { type: string }

