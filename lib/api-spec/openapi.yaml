    AdminActivatePlanResponse:
      type: object
      required: [ok, bakerId, subscriptionPlan, message]
      properties:
        ok: { type: boolean }
        bakerId: { type: integer }
        subscriptionPlan: { type: string }
        trialEndsAt: { type: ["string", "null"] }
        message: { type: string }
