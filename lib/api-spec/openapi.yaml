openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Sweet Tooth — Pakistan's Home Baker Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bakers
    description: Baker operations
  - name: products
    description: Product catalog operations
  - name: orders
    description: Order management
  - name: cart
    description: Cart operations
  - name: reviews
    description: Review operations
  - name: customers
    description: Customer/buyer operations
  - name: marketplace
    description: Marketplace discovery
  - name: chat
    description: AI agent chat
  - name: analytics
    description: Dashboard analytics
  - name: billing
    description: Platform subscription billing (manual WhatsApp)
  - name: admin
    description: Founder/admin operations
  - name: knowledge
    description: RAG knowledge index
  - name: khata
    description: Inventory, ledger, and margin analytics
  - name: workspace
    description: Baker goals, notes, and reminders
  - name: broadcast
    description: WhatsApp customer broadcasts

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── MARKETPLACE ──────────────────────────────────────────────────────────────
  /marketplace/featured:
    get:
      operationId: getFeaturedBakers
      tags: [marketplace]
      summary: Get featured bakers for homepage
      parameters:
        - name: city
          in: query
          schema: { type: string }
        - name: area
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Featured bakers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BakerCard"

  /marketplace/search:
    get:
      operationId: searchMarketplace
      tags: [marketplace]
      summary: Search bakers and products
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: city
          in: query
          schema: { type: string }
        - name: area
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: occasion
          in: query
          schema: { type: string }
        - name: dietary
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"

  /marketplace/categories:
    get:
      operationId: getCategories
      tags: [marketplace]
      summary: Get product categories with counts
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  # ── BAKERS ───────────────────────────────────────────────────────────────────
  /bakers:
    get:
      operationId: listBakers
      tags: [bakers]
      summary: List all bakers
      parameters:
        - name: city
          in: query
          schema: { type: string }
        - name: area
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of bakers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BakerCard"
    post:
      operationId: createBaker
      tags: [bakers]
      summary: Register a new baker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BakerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Baker"

  /bakers/login:
    post:
      operationId: loginBaker
      tags: [bakers]
      summary: Login baker with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required: [token, baker]
                properties:
                  token: { type: string }
                  baker: { $ref: "#/components/schemas/Baker" }
        "401":
          description: Invalid credentials

  /bakers/forgot-password:
    post:
      operationId: forgotBakerPassword
      tags: [bakers]
      summary: Request a baker password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Generic success so the endpoint does not reveal whether the email exists
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
                  emailConfigured: { type: boolean, description: False when Resend/SMTP is not set on the API }
                  resetUrl: { type: string, description: Present only in local development }
        "400":
          description: Invalid email
        "429":
          description: Too many requests

  /bakers/reset-password:
    post:
      operationId: resetBakerPassword
      tags: [bakers]
      summary: Set a new baker password with a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        "400":
          description: Invalid or expired token
        "429":
          description: Too many requests

  /bakers/change-password:
    post:
      operationId: changeBakerPassword
      tags: [bakers]
      summary: Change password while signed in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        "400":
          description: Incorrect current password or weak new password
        "401":
          description: Not signed in

  /bakers/{bakerId}:
    get:
      operationId: getBaker
      tags: [bakers]
      summary: Get baker profile
      parameters:
        - name: bakerId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Baker profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Baker"
        "404":
          description: Not found
    patch:
      operationId: updateBaker
      tags: [bakers]
      summary: Update baker profile
      parameters:
        - name: bakerId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BakerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Baker"

  /bakers/{bakerId}/products:
    get:
      operationId: getBakerProducts
      tags: [bakers]
      summary: Get baker's product catalog
      parameters:
        - name: bakerId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /bakers/{bakerId}/reviews:
    get:
      operationId: getBakerReviews
      tags: [bakers]
      summary: Get baker's reviews
      parameters:
        - name: bakerId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"

  /bakers/{bakerId}/stats:
    get:
      operationId: getBakerStats
      tags: [bakers]
      summary: Get baker dashboard stats summary
      parameters:
        - name: bakerId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BakerStats"

  # ── PRODUCTS ──────────────────────────────────────────────────────────────────
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products (optionally filter by baker)
      parameters:
        - name: bakerId
          in: query
          schema: { type: integer }
        - name: category
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{productId}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /products/{productId}/toggle-stock:
    patch:
      operationId: toggleProductStock
      tags: [products]
      summary: Toggle product availability
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  # ── ORDERS ────────────────────────────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders (filter by baker or buyer)
      parameters:
        - name: bakerId
          in: query
          schema: { type: integer }
        - name: buyerId
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found

  /orders/{orderId}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{orderId}/payment:
    patch:
      operationId: markOrderPaid
      tags: [orders]
      summary: Mark order as paid (COD received)
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{orderId}/verify-payment:
    post:
      operationId: verifyOrderPayment
      tags: [orders]
      summary: Advisory OCR on a receipt (never marks paid). Accepts uploaded image or saved screenshot URL.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                imageBase64:
                  type: string
                  description: Raw base64 or data URL of JPEG/PNG/WebP receipt
                contentType:
                  type: string
                  enum: [image/jpeg, image/png, image/webp]
      responses:
        "200":
          description: OCR advisory result
          content:
            application/json:
              schema:
                type: object
                required: [verified, message]
                properties:
                  verified: { type: boolean }
                  message: { type: string }
                  decision: { type: string }
                  confidence: { type: number }
        "400":
          description: Missing receipt or OCR failed
        "401":
          description: Unauthorized

  /orders/{orderId}/payment-screenshot:
    patch:
      operationId: setOrderPaymentScreenshot
      tags: [orders]
      summary: Save receipt image URL or data URL for OCR (does not mark paid)
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentScreenshotUrl]
              properties:
                paymentScreenshotUrl: { type: string }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  # ── CART (removed — guest checkout is POST /orders) ─────────────────────────
  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Deprecated — browser cart removed
      deprecated: true
      parameters:
        - name: buyerId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "410":
          description: Gone — use guest POST /orders instead
    post:
      operationId: addToCart
      tags: [cart]
      summary: Deprecated — browser cart removed
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemInput"
      responses:
        "410":
          description: Gone — use guest POST /orders instead

  /cart/{cartItemId}:
    delete:
      operationId: removeFromCart
      tags: [cart]
      summary: Deprecated — browser cart removed
      deprecated: true
      parameters:
        - name: cartItemId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "410":
          description: Gone

  /cart/clear:
    delete:
      operationId: clearCart
      tags: [cart]
      summary: Deprecated — browser cart removed
      deprecated: true
      parameters:
        - name: buyerId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "410":
          description: Gone

  # ── REVIEWS ───────────────────────────────────────────────────────────────────
  /reviews:
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  # ── CUSTOMERS ─────────────────────────────────────────────────────────────────
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers for a baker
      parameters:
        - name: bakerId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"

  /customers/{customerId}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get customer details
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  # ── ANALYTICS ─────────────────────────────────────────────────────────────────
  /analytics/baker/{bakerId}/{period}:
    get:
      operationId: getBakerAnalytics
      tags: [analytics]
      summary: Get baker analytics data
      parameters:
        - name: bakerId
          in: path
          required: true
          schema: { type: integer }
        - name: period
          in: path
          required: true
          schema:
            type: string
            enum: [daily, weekly, monthly]
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsData"

  /analytics/baker/{bakerId}/sources:
    get:
      operationId: getOrderSources
      tags: [analytics]
      summary: Get order source breakdown for baker
      parameters:
        - name: bakerId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Source breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderSourceStat"

  /analytics/baker/{bakerId}/weekly-report:
    get:
      operationId: getWeeklySuccessReport
      tags: [analytics]
      summary: Get weekly success report
      parameters:
        - name: bakerId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Weekly success report metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklySuccessReport"

  # ── CHAT ──────────────────────────────────────────────────────────────────────
  /chat:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send message to marketplace AI agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: Agent reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"

  /chat/{bakerId}/history/{buyerId}:
    get:
      operationId: getChatHistory
      tags: [chat]
      summary: Get chat history for a buyer+baker pair
      parameters:
        - name: bakerId
          in: path
          required: true
          schema: { type: integer }
        - name: buyerId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Chat messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"

  # ── NOTIFICATIONS ─────────────────────────────────────────────────────────────
  /bakers/{bakerId}/notifications:
    get:
      operationId: listNotifications
      tags: [bakers]
      summary: List baker notifications
      parameters:
        - name: bakerId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BakerNotification"

  /bakers/{bakerId}/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [bakers]
      summary: Mark all notifications as read
      parameters:
        - name: bakerId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: All marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /bakers/{bakerId}/notifications/{notifId}/read:
    patch:
      operationId: markNotificationRead
      tags: [bakers]
      summary: Mark single notification as read
      parameters:
        - name: bakerId
          in: path
          required: true
          schema: { type: integer }
        - name: notifId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Notification marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BakerNotification"

  # ── AGENT CONFIG ───────────────────────────────────────────────────────────────
  /bakers/{bakerId}/agent-config:
    get:
      operationId: getAgentConfig
      tags: [bakers]
      summary: Get baker agent configuration
      parameters:
        - name: bakerId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Agent configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfig"
    put:
      operationId: updateAgentConfig
      tags: [bakers]
      summary: Update baker agent configuration
      parameters:
        - name: bakerId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentConfigInput"
      responses:
        "200":
          description: Updated agent configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfig"

  # ── KNOWLEDGE RAG ──────────────────────────────────────────────────────────────
  /bakers/{bakerId}/knowledge/reindex:
    post:
      operationId: reindexBakerKnowledge
      tags: [knowledge]
      summary: Rebuild RAG embeddings from products and policies
      parameters:
        - name: bakerId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Reindex result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeReindexResult"
        "404":
          description: Baker not found

  /bakers/{bakerId}/knowledge/query:
    post:
      operationId: queryBakerKnowledge
      tags: [knowledge]
      summary: Query baker knowledge index (debug / preview)
      parameters:
        - name: bakerId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeQueryInput"
      responses:
        "200":
          description: Retrieved knowledge chunks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeQueryResult"

  # ── PLATFORM BILLING (manual WhatsApp — no payment gateway) ───────────────────
  /billing/platform:
    get:
      operationId: getPlatformBilling
      tags: [billing]
      summary: Public platform contact for plan payments (WhatsApp only)
      responses:
        "200":
          description: Platform billing config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformBillingConfig"

  /bakers/{bakerId}/billing:
    get:
      operationId: getBakerBilling
      tags: [billing]
      summary: Baker subscription + pending upgrade state
      parameters:
        - name: bakerId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Billing state
          content:
