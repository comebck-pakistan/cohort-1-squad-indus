components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    # ── Baker schemas ─────────────────────────────────────────────────────────
    BakerCard:
      type: object
      required: [id, businessName, city, ratingAvg, totalOrders, isActive, slug]
      properties:
        id: { type: integer }
        businessName: { type: string }
        tagline: { type: ["string", "null"] }
        city: { type: string }
        area: { type: ["string", "null"] }
        deliveryAreas: { type: array, items: { type: string } }
        ratingAvg: { type: number }
        totalOrders: { type: integer }
        isActive: { type: boolean }
        agentActive: { type: boolean }
        marketplaceVisible: { type: boolean }
        slug: { type: string }
        photoUrl: { type: ["string", "null"] }
        categories: { type: array, items: { type: string } }
        startingPrice: { type: ["integer", "null"] }

    Baker:
      type: object
      required: [id, businessName, city, slug, createdAt]
      properties:
        id: { type: integer }
        businessName: { type: string }
        ownerName: { type: string }
        tagline: { type: ["string", "null"] }
        bio: { type: ["string", "null"] }
        city: { type: string }
        area: { type: ["string", "null"] }
        whatsappNumber: { type: string }
        email: { type: ["string", "null"] }
        deliveryAreas: { type: array, items: { type: string } }
        codPolicy: { type: ["string", "null"] }
        returnPolicy: { type: ["string", "null"] }
        maxOrdersPerDay: { type: integer }
        agentActive: { type: boolean }
        marketplaceVisible: { type: boolean }
        subscriptionPlan: { type: string }
        ratingAvg: { type: number }
        totalOrders: { type: integer }
        slug: { type: string }
        photoUrl: { type: ["string", "null"] }
        requireAdvance: { type: boolean }
        cancellationReason: { type: ["string", "null"] }
        cancelledBy: { type: ["string", "null"] }
        cancelledAt: { type: ["string", "null"] }
        advanceThresholdPkr: { type: integer }
        advancePercentage: { type: integer }
        paymentDetails: { type: string }
        blockedDates: { type: array, items: { type: string, format: date } }
        socialLinks:
          type: object
          properties:
            instagram: { type: string, format: uri }
            facebook: { type: string, format: uri }
        createdAt: { type: string }

    BakerInput:
      type: object
      required: [businessName, ownerName, city, whatsappNumber, email, password]
      properties:
        businessName: { type: string }
        ownerName: { type: string }
        tagline: { type: string }
        bio: { type: string }
        city: { type: string }
        area: { type: string }
        whatsappNumber: { type: string }
        email: { type: string }
        password: { type: string }
        deliveryAreas: { type: array, items: { type: string } }
        codPolicy: { type: string }
        returnPolicy: { type: string }
        maxOrdersPerDay: { type: integer }
        slug: { type: string }
        photoUrl: { type: string }
        requireAdvance: { type: boolean }
        advanceThresholdPkr: { type: integer }
        advancePercentage: { type: integer }
        paymentDetails: { type: string }

    BakerUpdate:
      type: object
      properties:
        businessName: { type: string }
        ownerName: { type: string }
        tagline: { type: string }
        bio: { type: string }
        city: { type: string }
        area: { type: string }
        deliveryAreas: { type: array, items: { type: string } }
        codPolicy: { type: string }
        returnPolicy: { type: string }
        maxOrdersPerDay: { type: integer }
        agentActive: { type: boolean }
        marketplaceVisible: { type: boolean }
        photoUrl: { type: string }
        requireAdvance: { type: boolean }
        advanceThresholdPkr: { type: integer }
        advancePercentage: { type: integer }
        paymentDetails: { type: string }
        blockedDates: { type: array, items: { type: string, format: date } }
        pickupAddress: { type: string }
        allowPickup: { type: boolean }
        allowDelivery: { type: boolean }
        cancellationAllowed: { type: boolean }
        cancellationHoursBefore: { type: integer }
        cancellationPolicy: { type: string }
        socialLinks:
          type: object
          properties:
            instagram: { type: string, format: uri }
            facebook: { type: string, format: uri }
        drops:
          type: array
          description: Flash drops stored in agentConfig (id, product title, release date).
          items:
            type: object
            required: [id]
            properties:
              id: { type: string }
              productId: { type: integer }
              productName: { type: string }
              title: { type: string }
              releaseDate: { type: string, format: date }
              date: { type: string, format: date }
              releaseTime: { type: string }
              limitStock: { type: integer }
              active: { type: boolean }

    BakerStats:
      type: object
      required: [bakerId, todayOrders, todayRevenue, totalOrders, totalRevenue, pendingOrders, agentActive]
      properties:
        bakerId: { type: integer }
        todayOrders: { type: integer }
        todayRevenue: { type: integer }
        weekOrders: { type: integer }
        weekRevenue: { type: integer }
        totalOrders: { type: integer }
        totalRevenue: { type: integer }
        pendingOrders: { type: integer }
        outstandingPayments: { type: integer }
        agentActive: { type: boolean }
        topProduct: { type: ["string", "null"] }
        newCustomersThisMonth: { type: integer }

    # ── Product schemas ───────────────────────────────────────────────────────
    ProductSize:
      type: object
      required: [label, pricePkr]
      properties:
        label: { type: string }
        pricePkr: { type: integer }

    Product:
      type: object
      required: [id, bakerId, name, basePricePkr, isAvailable, category, createdAt]
      properties:
        id: { type: integer }
        bakerId: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        basePricePkr: { type: integer }
        sizes: { type: array, items: { $ref: "#/components/schemas/ProductSize" } }
        variants: { type: array, items: { type: string } }
        isEgglessAvailable: { type: boolean }
        isAvailable: { type: boolean }
        leadTimeDays: { type: integer }
        category: { type: string }
        occasionTags: { type: array, items: { type: string } }
        dietaryTags: { type: array, items: { type: string } }
        ingredients: { type: array, items: { type: string } }
        allergens: { type: array, items: { type: string } }
        suggestionTags: { type: array, items: { type: string } }
        pickupAvailable: { type: boolean }
        deliveryAvailable: { type: boolean }
        leadTimeHours: { type: ["integer", "null"] }
        photoUrl: { type: ["string", "null"] }
        totalOrders: { type: integer }
        isBestSeller: { type: boolean }
        isTopRated: { type: boolean }
        displayOrder: { type: integer }
        recipeCostPkr: { type: ["integer", "null"] }
        createdAt: { type: string }

    ProductInput:
      type: object
      required: [bakerId, name, basePricePkr, category]
      properties:
        bakerId: { type: integer }
        name: { type: string }
        description: { type: string }
        basePricePkr: { type: integer }
        sizes: { type: array, items: { $ref: "#/components/schemas/ProductSize" } }
        variants: { type: array, items: { type: string } }
        isEgglessAvailable: { type: boolean }
        isAvailable: { type: boolean }
        leadTimeDays: { type: integer }
        category: { type: string }
        occasionTags: { type: array, items: { type: string } }
        dietaryTags: { type: array, items: { type: string } }
        ingredients: { type: array, items: { type: string } }
        allergens: { type: array, items: { type: string } }
        suggestionTags: { type: array, items: { type: string } }
        pickupAvailable: { type: boolean }
        deliveryAvailable: { type: boolean }
        leadTimeHours: { type: ["integer", "null"] }
        photoUrl: { type: string }
        recipeCostPkr: { type: ["integer", "null"] }

    ProductUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        basePricePkr: { type: integer }
        sizes: { type: array, items: { $ref: "#/components/schemas/ProductSize" } }
        variants: { type: array, items: { type: string } }
        isEgglessAvailable: { type: boolean }
        isAvailable: { type: boolean }
        leadTimeDays: { type: integer }
        category: { type: string }
        occasionTags: { type: array, items: { type: string } }
        dietaryTags: { type: array, items: { type: string } }
        ingredients: { type: array, items: { type: string } }
        allergens: { type: array, items: { type: string } }
        suggestionTags: { type: array, items: { type: string } }
        pickupAvailable: { type: boolean }
        deliveryAvailable: { type: boolean }
        leadTimeHours: { type: ["integer", "null"] }
        photoUrl: { type: string }
        recipeCostPkr: { type: ["integer", "null"] }
        displayOrder: { type: integer }

    # ── Order schemas ─────────────────────────────────────────────────────────
    OrderItem:
      type: object
      required: [productId, productName, quantity, unitPricePkr, sizeLabel]
      properties:
        productId: { type: integer }
        productName: { type: string }
        quantity: { type: integer }
        unitPricePkr: { type: integer }
        sizeLabel: { type: string }
        variant: { type: ["string", "null"] }

    Order:
      type: object
      required: [id, bakerId, buyerName, buyerWhatsapp, buyerAddress, totalPkr, status, paymentStatus, source, createdAt]
      properties:
        id: { type: integer }
        bakerId: { type: integer }
        buyerId: { type: ["integer", "null"] }
        buyerName: { type: string }
        buyerWhatsapp: { type: string }
        buyerAddress: { type: string }
        buyerArea: { type: ["string", "null"] }
        items: { type: array, items: { $ref: "#/components/schemas/OrderItem" } }
        totalPkr: { type: integer }
        deliveryDate: { type: ["string", "null"] }
        status: { type: string }
        paymentStatus: { type: string }
        paymentAmountReceived: { type: ["integer", "null"] }
        source: { type: string }
        occasion: { type: ["string", "null"] }
        specialInstructions: { type: ["string", "null"] }
        flavour: { type: ["string", "null"] }
        textOnCake: { type: ["string", "null"] }
        paymentScreenshotUrl: { type: ["string", "null"] }
        advancePaid: { type: boolean }
        requireAdvance: { type: boolean }
        fulfillmentType: { type: string, enum: [delivery, pickup] }
        deliveredAt: { type: ["string", "null"], format: date-time }
        serviceFeedback: { type: ["string", "null"], enum: [loved_it, okay, had_issue] }
        feedbackNote: { type: ["string", "null"] }
        cancellationReason: { type: ["string", "null"] }
        cancelledBy: { type: ["string", "null"] }
        cancelledAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string }
        updatedAt: { type: string }

    OrderInput:
      type: object
      required: [bakerId, buyerName, buyerWhatsapp, buyerAddress, items]
      properties:
        bakerId: { type: integer }
        buyerId: { type: integer }
        buyerName: { type: string }
        buyerWhatsapp: { type: string }
        buyerAddress: { type: string }
        buyerArea: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/OrderItem" } }
        totalPkr:
          type: integer
          description: Ignored — server prices from catalog
          deprecated: true
        deliveryDate: { type: string }
        source: { type: string }
        occasion: { type: string }
        specialInstructions: { type: string }
        flavour: { type: string }
        textOnCake: { type: string }
        paymentScreenshotUrl: { type: string }
        advancePaid: { type: boolean }
        requireAdvance: { type: boolean }
        fulfillmentType: { type: string, enum: [delivery, pickup] }

    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string }
        cancellationReason: { type: string }
        cancelledBy: { type: string }

    PaymentUpdate:
      type: object
      required: [amountReceived]
      properties:
        amountReceived: { type: integer }

    # ── Cart schemas ──────────────────────────────────────────────────────────
    CartItem:
      type: object
      required: [id, buyerId, bakerId, productId, productName, sizeLabel, quantity, unitPricePkr, addedAt]
      properties:
        id: { type: integer }
        buyerId: { type: integer }
        bakerId: { type: integer }
        productId: { type: integer }
        productName: { type: string }
        sizeLabel: { type: string }
        variant: { type: ["string", "null"] }
        quantity: { type: integer }
        unitPricePkr: { type: integer }
        photoUrl: { type: ["string", "null"] }
        addedAt: { type: string }

    CartItemInput:
      type: object
      required: [buyerId, bakerId, productId, productName, sizeLabel, quantity, unitPricePkr]
      properties:
        buyerId: { type: integer }
        bakerId: { type: integer }
        productId: { type: integer }
        productName: { type: string }
        sizeLabel: { type: string }
        variant: { type: string }
        quantity: { type: integer }
        unitPricePkr: { type: integer }
        photoUrl: { type: string }

    # ── Review schemas ────────────────────────────────────────────────────────
    Review:
      type: object
      required: [id, bakerId, buyerName, rating, createdAt]
      properties:
        id: { type: integer }
        bakerId: { type: integer }
        buyerId: { type: ["integer", "null"] }
        orderId: { type: ["integer", "null"] }
        buyerName: { type: string }
        rating: { type: integer }
        ratingProduct: { type: ["integer", "null"] }
        ratingPackaging: { type: ["integer", "null"] }
        reviewText: { type: ["string", "null"] }
        productName: { type: ["string", "null"] }
        createdAt: { type: string }

    ReviewInput:
      type: object
      required: [bakerId, buyerName, rating]
      properties:
        bakerId: { type: integer }
        buyerId: { type: integer }
        orderId: { type: integer }
        buyerName: { type: string }
        rating: { type: integer }
        ratingProduct: { type: integer }
        ratingPackaging: { type: integer }
        reviewText: { type: string }
        productName: { type: string }

    # ── Customer schemas ──────────────────────────────────────────────────────
    Customer:
      type: object
      required: [id, name, whatsappNumber, totalOrders, totalSpentPkr, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        whatsappNumber: { type: string }
        city: { type: ["string", "null"] }
        preferredArea: { type: ["string", "null"] }
        totalOrders: { type: integer }
        totalSpentPkr: { type: integer }
        lastOrderAt: { type: ["string", "null"] }
        isRegular: { type: boolean }
        isAtRisk: { type: boolean }
        createdAt: { type: string }

    # ── Marketplace schemas ───────────────────────────────────────────────────
    SearchResults:
      type: object
      required: [bakers, products]
      properties:
        bakers:
          type: array
          items:
            $ref: "#/components/schemas/BakerCard"
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"

    Category:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer }
        icon: { type: ["string", "null"] }

    # ── Analytics schemas ─────────────────────────────────────────────────────
    AnalyticsDataPoint:
      type: object
      required: [date, orders, revenue]
      properties:
        date: { type: string }
        orders: { type: integer }
        revenue: { type: integer }

    AnalyticsData:
      type: object
      required: [period, dataPoints, totalOrders, totalRevenue, avgOrderValue, topProducts]
      properties:
        period: { type: string }
        dataPoints:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsDataPoint"
        totalOrders: { type: integer }
        totalRevenue: { type: integer }
        avgOrderValue: { type: integer }
        topProducts:
          type: array
          items:
            $ref: "#/components/schemas/TopProduct"
        topDeliveryAreas:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryAreaStat"
        priceBands:
          type: array
          items:
            $ref: "#/components/schemas/PriceBandStat"
        productTrends:
          type: array
          items:
            $ref: "#/components/schemas/ProductTrend"
        salesForecast:
          $ref: "#/components/schemas/SalesForecast"
        newCustomers: { type: integer }
        repeatCustomers: { type: integer }
        cancellationAnalytics:
          type: object
          properties:
            total: { type: integer }
            rate: { type: integer }
            byReason: { type: array, items: { $ref: "#/components/schemas/NamedCount" } }
            byProduct: { type: array, items: { $ref: "#/components/schemas/NamedCount" } }
            byActor: { type: array, items: { $ref: "#/components/schemas/NamedCount" } }

    NamedCount:
      type: object
      properties:
        name: { type: string }
        count: { type: integer }

    TopProduct:
      type: object
      required: [name, orders, revenue]
      properties:
        name: { type: string }
        orders: { type: integer }
        revenue: { type: integer }

    DeliveryAreaStat:
      type: object
      required: [area, orders]
      properties:
        area: { type: string }
        orders: { type: integer }

    PriceBandStat:
      type: object
      required: [name, orders, revenue]
      properties:
        name: { type: string }
        orders: { type: integer }
        revenue: { type: integer }

    ProductTrend:
      type: object
      required: [name, currentOrders, previousOrders, changePercent]
      properties:
        name: { type: string }
        currentOrders: { type: integer }
        previousOrders: { type: integer }
        changePercent: { type: integer }

    SalesForecast:
      type: object
      required: [next7DaysOrders, next7DaysRevenue, confidence, method]
      properties:
        next7DaysOrders: { type: integer }
        next7DaysRevenue: { type: integer }
        confidence: { type: string, enum: [low, medium, high] }
        method: { type: string }

    OrderSourceStat:
      type: object
      required: [source, orders, revenue, percentage]
      properties:
        source: { type: string }
        orders: { type: integer }
        revenue: { type: integer }
        percentage: { type: number }

    WeeklySuccessReport:
      type: object
      required: [ordersCount, ordersTrendPercent, repeatBuyersCount, avgResponseTimeSec, failedPaymentReviewsCount]
      properties:
        ordersCount: { type: integer }
        ordersTrendPercent: { type: integer }
        repeatBuyersCount: { type: integer }
        avgResponseTimeSec: { type: integer }
        failedPaymentReviewsCount: { type: integer }

