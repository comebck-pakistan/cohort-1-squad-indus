        instagramAgentEnabled: { type: boolean }
        metaWebhookToken: { type: ["string", "null"] }
        instagramPageId: { type: ["string", "null"] }
        customGreeting: { type: ["string", "null"] }
        shopPlaybook: { type: ["string", "null"] }
        blockedTopics: { type: array, items: { type: string } }
        escalateKeywords: { type: array, items: { type: string } }
