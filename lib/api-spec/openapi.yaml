      type: object
      required: [query]
      properties:
        query: { type: string }

    KnowledgeChunkHit:
      type: object
      required: [id, content, sourceType, score]
      properties:
        id: { type: integer }
        content: { type: string }
        sourceType: { type: string }
        sourceId: { type: ["integer", "null"] }
        score: { type: number }
        metadata: { type: object, additionalProperties: true }

    KnowledgeQueryResult:
      type: object
      required: [chunks, context]
      properties:
        context: { type: string }
        chunks:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeChunkHit"

    PlatformBillingConfig:
      type: object
      required: [enabled, ownerName, whatsappNumber, whatsappChatUrl, paymentDetails, instructions]
      properties:
        enabled: { type: boolean }
        ownerName: { type: string }
        whatsappNumber: { type: ["string", "null"] }
        whatsappDisplay: { type: ["string", "null"] }
        whatsappChatUrl: { type: ["string", "null"] }
        paymentDetails: { type: string, description: WhatsApp-only contact copy. No JazzCash or bank accounts. }
        instructions: { type: string }

    BakerBillingPending:
      type: object
      required: [planId, name, amountLabel, requestedAt]
      properties:
        planId: { type: string, enum: [starter, pro, bakery_plus] }
        name: { type: string }
        amountLabel: { type: string }
        requestedAt: { type: ["string", "null"] }

    BakerBillingState:
      type: object
      required: [subscriptionPlan, pending, platform]
      properties:
        subscriptionPlan: { type: string }
        pending:
          oneOf:
            - $ref: "#/components/schemas/BakerBillingPending"
            - type: "null"
        platform:
          $ref: "#/components/schemas/PlatformBillingConfig"

    BillingUpgradeRequest:
      type: object
      required: [planId]
      properties:
        planId: { type: string, enum: [starter, pro, bakery_plus] }
        note: { type: string, maxLength: 240 }

    BillingUpgradeResponse:
      type: object
      required: [ok, platform, plan, whatsappUrl, message]
      properties:
        ok: { type: boolean }
        pendingPlanId: { type: string }
        billingRequestedAt: { type: string }
        platform:
          $ref: "#/components/schemas/PlatformBillingConfig"
        plan:
          type: object
          required: [id, name, amountLabel]
          properties:
            id: { type: string }
            name: { type: string }
            amountLabel: { type: string }
        whatsappUrl: { type: ["string", "null"] }
        message: { type: string }

    AdminActivatePlanRequest:
      type: object
      required: [bakerId, planId]
      properties:
        bakerId: { type: integer }
        planId: { type: string, enum: [starter, pro, bakery_plus] }
